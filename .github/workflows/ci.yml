name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          coverage: none
          # pcntl is what lets `lava serve` stop the server it started when the
          # command itself is stopped. The command guards it behind
          # function_exists — `lava serve` has to work without process control —
          # so without this the guarantee is real but untested. ServeShutdownTest
          # skips where pcntl is absent, which is honest and also invisible;
          # asking for it here is what keeps that skip from becoming the norm.
          extensions: pcntl
      - name: Install (monorepo, all packs via path repositories)
        run: composer install --no-interaction --no-progress
      - name: Verify (phpunit all suites + phpstan)
        run: composer verify

  isolated-install:
    name: Prove pack decoupling by standalone install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Each pack installs with only its own declared dependencies
        # `composer validate`, NOT `--strict`. Every pack requires `lava/core:
        # @dev`, which is what a path repository needs before the packs are on
        # packagist; composer calls that an unbound constraint and `--strict`
        # turns the warning into a non-zero exit, so `--strict` here failed the
        # build on every pack. Plain `validate` still fails on a real error in
        # the file, which is what this step is actually checking.
        run: |
          for pkg in db validate view http-client; do
            rm -rf /tmp/iso && mkdir -p /tmp/iso/packages
            cp -r packages/core "packages/$pkg" /tmp/iso/packages/
            (
              cd "/tmp/iso/packages/$pkg" \
                && composer install --no-interaction --no-progress \
                && composer validate \
                && echo "OK: lava/$pkg installed standalone"
            )
          done

  skeleton:
    name: Prove lava/app boots green from a fresh install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Fresh copy of the skeleton, beside core, installed for real
        # The layout matters: `vendor/lava/core` is a SYMLINK to the sibling
        # core, which is what every path-repo install looks like. That symlink is
        # what made the binary load the monorepo's autoloader instead of the
        # app's, so this job fails if that regression ever comes back.
        run: |
          rm -rf /tmp/skeleton && mkdir -p /tmp/skeleton/packages
          cp -r packages/core packages/app /tmp/skeleton/packages/
          rm -rf /tmp/skeleton/packages/app/vendor /tmp/skeleton/packages/app/composer.lock
          cd /tmp/skeleton/packages/app
          composer install --no-interaction --no-progress
          # R2: the skeleton ships a pre-generated AGENTS.md that is accurate
          # from the moment of `composer install` — no chicken-and-egg with
          # `lava map`, so this passes on a fresh checkout with no map run.
          ./vendor/bin/lava map --check
          ./vendor/bin/lava check --strict

  demo:
    name: Prove apps/demo boots, migrates and passes green
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          # pdo_sqlite is the demo's default driver and IS in this image, so no
          # extra step is needed — but it is the reason this job can run the
          # migrations against a real file instead of only against memory.
          coverage: none
      - name: Fresh copy of the demo, beside the packs it loads, installed for real
        # The demo is the canonical app, so it is the one place a change to any
        # pack has to survive contact with an app that actually uses it. Every
        # pack the demo's composer.json requires must be copied here or the
        # install fails on a path repository that is not on disk — which is why
        # this list and `apps/demo/composer.json` move together.
        #
        # Installed rather than run in-tree for the same reason as the skeleton:
        # `vendor/lava/core` must be a symlink to the sibling checkout, which is
        # what a real install looks like.
        run: |
          rm -rf /tmp/demo && mkdir -p /tmp/demo/packages /tmp/demo/apps
          cp -r packages/core packages/db packages/validate packages/view packages/http-client /tmp/demo/packages/
          cp -r apps/demo /tmp/demo/apps/demo
          rm -rf /tmp/demo/apps/demo/vendor /tmp/demo/apps/demo/composer.lock
          cd /tmp/demo/apps/demo
          composer install --no-interaction --no-progress
      - name: The quick start in the README, run for real
        # A committed AGENTS.md is only trustworthy if something checks it on
        # every change, and the migration path is only trustworthy if it runs
        # against a file rather than only against sqlite::memory:.
        working-directory: /tmp/demo/apps/demo
        run: |
          ./vendor/bin/lava db:migrate
          ./vendor/bin/lava app:seed
          ./vendor/bin/lava app:stats --json
      - name: The README's `lava serve` claim, over a real socket
        # `lava check` runs the suite in-process, where `TestClient` never opens
        # a socket — so the two claims the README makes about serving cannot be
        # checked there. This is the only place they are:
        #
        #  - `/` is HTML a browser can read, with links `url()` built;
        #  - `/upstream/health` fetches the app's OWN `/health`, because
        #    `app.upstream` defaults to `http://127.0.0.1:8080`. That self-fetch
        #    is the demo's claim that `lava serve` in one terminal is the whole
        #    setup, and it fails here if the default port and `lava serve`'s
        #    default ever drift apart.
        #
        # No `--port` on purpose: the claim under test is the DEFAULT one, and
        # pinning the port would make this pass while the default was broken.
        # (Value flags take `=` — `--port 8080` would be a bare flag plus a
        # positional argument, and the port would silently stay 8080.)
        #
        # The server is stopped on every exit path, including a failure: a step
        # that leaves it running hands an orphan holding 8080 to the rest of the
        # job, and a background process the runner is still tracking is how a
        # green step becomes a hung one. `lava serve` stops its own server when
        # it is stopped, so killing this process is enough — see ServeShutdownTest.
        working-directory: /tmp/demo/apps/demo
        run: |
          ./vendor/bin/lava serve >/tmp/demo-serve.log 2>&1 &
          serve_pid=$!
          trap 'kill "$serve_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8080/health >/dev/null && break
            sleep 0.25
          done

          board=$(curl -sf http://127.0.0.1:8080/)
          echo "$board" | grep -q 'href="/tasks/export"' \
            || { echo "the board did not link the export route"; exit 1; }

          upstream=$(curl -sf http://127.0.0.1:8080/upstream/health)
          echo "upstream said: $upstream"
          echo "$upstream" | grep -q '"status":"ok"' \
            || { echo "the self-fetch did not come back ok"; exit 1; }
      - name: Verify the app the way its README says to
        working-directory: /tmp/demo/apps/demo
        run: |
          ./vendor/bin/lava map --check
          ./vendor/bin/lava check --strict