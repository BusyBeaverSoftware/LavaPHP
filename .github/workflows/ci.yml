name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          coverage: none
          # pcntl is what lets `lava serve` stop the server it started when the
          # command itself is stopped. The command guards it behind
          # function_exists — `lava serve` has to work without process control —
          # so without this the guarantee is real but untested. ServeShutdownTest
          # skips where pcntl is absent, which is honest and also invisible;
          # asking for it here is what keeps that skip from becoming the norm.
          extensions: pcntl
      - name: Install (monorepo, all packs via path repositories)
        run: composer install --no-interaction --no-progress
      - name: Verify (phpunit all suites + phpstan level 8 + core at max)
        run: composer verify

  coverage:
    name: Measure the packs, with the CLI subprocesses counted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          # pcov, not xdebug: this suite spawns ~150 `bin/lava` children, and
          # each one pays the driver's startup cost — which is the whole reason
          # pcov exists. pdo_sqlite comes with the image, and the `db` pack's
          # CLI tests need it in BOTH processes; the gate refuses to report a
          # number it knows is short without it.
          coverage: pcov
      - name: Install (monorepo, all packs via path repositories)
        run: composer install --no-interaction --no-progress
      - name: Coverage gate (floors per pack, enforced)
        # Two things have to be true for this number to mean anything, and
        # neither is automatic:
        #
        #  - `pcov.directory` must cover the repository. The harness captures
        #    the coverage of the `bin/lava` CHILDREN as well as the parent (see
        #    packages/core/tests/Support/fixture-autoload.php), and a child runs
        #    with its working directory set to a fixture app in /tmp — so pcov's
        #    own auto-detection tracks the wrong tree and the children
        #    contribute nothing.
        #  - the ini has to reach them through PHP_INI_SCAN_DIR rather than
        #    `php -d`, for the same reason: the harness forwards the ENVIRONMENT
        #    to its children, not the command line.
        #
        # Without both, `db` reads 55% — the parent-only measurement — and the
        # gate fails on a floor it cannot meet, which is the tripwire doing its
        # job, not a flake. See tools/coverage-check.php.
        run: |
          ini_dir="$RUNNER_TEMP/lava-coverage-ini"
          mkdir -p "$ini_dir"
          printf 'pcov.enabled=1\npcov.directory=%s\n' "$GITHUB_WORKSPACE" > "$ini_dir/40-pcov.ini"
          export PHP_INI_SCAN_DIR=":$ini_dir"
          composer coverage

  isolated-install:
    name: Prove pack decoupling by standalone install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Each package installs on its own, from the manifest a consumer receives
        # The same script `composer check:install` runs locally, so this green
        # can be had before a push. Each package is copied out as a fresh clone
        # has it, `composer validate --strict` runs on the manifest AS
        # PUBLISHED, and only then is the copy given path repositories to its
        # siblings — the packages carry none, because a published package
        # cannot (DECISIONS.md 229) — and installed.
        run: php tools/install-check.php core db validate view http-client events

  skeleton:
    name: Prove lavaphp/app boots green from a fresh install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Fresh copy of the skeleton, installed for real, then mapped and checked
        # The skeleton's manifest is the file `composer create-project lavaphp/app`
        # hands a consumer, so it is validated strictly as published and carries
        # no path repository; the copy is given one to its sibling core.
        # `vendor/lavaphp/core` is still a SYMLINK to that sibling — the layout that
        # once made the binary load the monorepo's autoloader instead of the
        # app's — so this still fails if that regression comes back. R2: the
        # skeleton ships a pre-generated AGENTS.md, so `lava map --check` passes
        # with no map run.
        run: php tools/install-check.php app

  publish-rehearsal:
    name: Rehearse publishing — mirrors, create-project, require, check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Each package as its own repository, consumed the way Packagist serves it
        # Local git repositories stand in for the mirrors split.yml pushes, and a
        # Composer home listing them stands in for Packagist. The consumer runs
        # the documented commands verbatim — create-project, require, check —
        # and every lavaphp/* package it locks must come from a mirror. Nothing is
        # pushed or published. `composer check:split` runs the same locally.
        run: php tools/split-check.php

  demo:
    name: Prove apps/demo boots, migrates and passes green
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          # pdo_sqlite is the demo's default driver and IS in this image, so no
          # extra step is needed — but it is the reason this job can run the
          # migrations against a real file instead of only against memory.
          coverage: none
      - name: Fresh copy of the demo, beside the packs it loads, installed for real
        # The demo is the canonical app, so it is the one place a change to any
        # pack has to survive contact with an app that actually uses it. Every
        # pack the demo's composer.json requires must be copied here or the
        # install fails on a path repository that is not on disk — which is why
        # this list and `apps/demo/composer.json` move together.
        #
        # Installed rather than run in-tree for the same reason as the skeleton:
        # `vendor/lavaphp/core` must be a symlink to the sibling checkout, which is
        # what a real install looks like.
        run: |
          rm -rf /tmp/demo && mkdir -p /tmp/demo/packages /tmp/demo/apps
          cp -r packages/core packages/db packages/validate packages/view packages/http-client /tmp/demo/packages/
          cp -r apps/demo /tmp/demo/apps/demo
          rm -rf /tmp/demo/apps/demo/vendor /tmp/demo/apps/demo/composer.lock
          cd /tmp/demo/apps/demo
          composer install --no-interaction --no-progress
          # The demo's constraints have to stay concrete. The packs declare
          # `lavaphp/core: ^0.1.0`, so a `@dev` in this manifest resolves to
          # `dev-main` and the install above dies on a core that cannot satisfy
          # them — which is exactly how this was found, and the install alone
          # does not say so clearly. This is not a publishability claim about an
          # app that is never published; it is the invariant that keeps the
          # demo's requirements resolvable against the packs it dogfoods.
          composer validate --strict
      - name: The quick start in the README, run for real
        # A committed AGENTS.md is only trustworthy if something checks it on
        # every change, and the migration path is only trustworthy if it runs
        # against a file rather than only against sqlite::memory:.
        working-directory: /tmp/demo/apps/demo
        run: |
          ./vendor/bin/lava db:migrate
          ./vendor/bin/lava app:seed
          ./vendor/bin/lava app:stats --json
      - name: The README's `lava serve` claim, over a real socket
        # `lava check` runs the suite in-process, where `TestClient` never opens
        # a socket — so the two claims the README makes about serving cannot be
        # checked there. This is the only place they are:
        #
        #  - `/` is HTML a browser can read, with links `url()` built;
        #  - `/upstream/health` fetches the app's OWN `/health`, because
        #    `app.upstream` defaults to `http://127.0.0.1:8080`. That self-fetch
        #    is the demo's claim that `lava serve` in one terminal is the whole
        #    setup, and it fails here if the default port and `lava serve`'s
        #    default ever drift apart.
        #
        # No `--port` on purpose: the claim under test is the DEFAULT one, and
        # pinning the port would make this pass while the default was broken.
        # (Value flags take `=` — `--port 8080` would be a bare flag plus a
        # positional argument, and the port would silently stay 8080.)
        #
        # The server is stopped on every exit path, including a failure: a step
        # that leaves it running hands an orphan holding 8080 to the rest of the
        # job, and a background process the runner is still tracking is how a
        # green step becomes a hung one. `lava serve` stops its own server when
        # it is stopped, so killing this process is enough — see ServeShutdownTest.
        working-directory: /tmp/demo/apps/demo
        run: |
          ./vendor/bin/lava serve >/tmp/demo-serve.log 2>&1 &
          serve_pid=$!
          trap 'kill "$serve_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8080/health >/dev/null && break
            sleep 0.25
          done

          board=$(curl -sf http://127.0.0.1:8080/)
          echo "$board" | grep -q 'href="/tasks/export"' \
            || { echo "the board did not link the export route"; exit 1; }

          upstream=$(curl -sf http://127.0.0.1:8080/upstream/health)
          echo "upstream said: $upstream"
          echo "$upstream" | grep -q '"status":"ok"' \
            || { echo "the self-fetch did not come back ok"; exit 1; }
      - name: Verify the app the way its README says to
        working-directory: /tmp/demo/apps/demo
        run: |
          ./vendor/bin/lava map --check
          ./vendor/bin/lava check --strict

  blog:
    name: Prove apps/blog boots, signs a visitor up over a socket and passes green
    runs-on: ubuntu-latest
    env:
      # The blog refuses to boot without a session secret — a cookie signed with
      # an empty key is forgeable — so every step that boots it needs one. A
      # literal is right here: it signs cookies inside one throwaway job.
      SESSION_SECRET: ci-only-session-secret-not-a-real-one
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Fresh copy of the blog, beside the packs it loads, installed for real
        # The same shape as the demo job, for the same reasons: a real install
        # symlinks `vendor/lavaphp/*` to sibling checkouts, and every pack
        # `apps/blog/composer.json` requires must be copied or the install fails
        # on a path repository that is not on disk. This list and that manifest
        # move together.
        run: |
          rm -rf /tmp/blog && mkdir -p /tmp/blog/packages /tmp/blog/apps
          cp -r packages/core packages/db packages/validate packages/view /tmp/blog/packages/
          cp -r apps/blog /tmp/blog/apps/blog
          rm -rf /tmp/blog/apps/blog/vendor /tmp/blog/apps/blog/composer.lock
          cd /tmp/blog/apps/blog
          composer install --no-interaction --no-progress
          composer validate --strict
      - name: Sign a visitor up over a real socket
        # `TestClient` never opens a socket, so this is the one place the session
        # cookie crosses a real HTTP boundary: the CSRF token read off the form, a
        # register POST carrying the cookie that token belongs to, and a page
        # that knows who is signed in afterwards. Then the one claim that
        # needs the global middleware to see unrouted requests: a mistyped URL
        # is the blog's own page, not the framework's.
        #
        # The server is stopped on every exit path; see the demo job for why.
        working-directory: /tmp/blog/apps/blog
        run: |
          ./vendor/bin/lava db:migrate
          ./vendor/bin/lava serve >/tmp/blog-serve.log 2>&1 &
          serve_pid=$!
          trap 'kill "$serve_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8080/health >/dev/null && break
            sleep 0.25
          done

          jar=$(mktemp)
          token=$(curl -sf -c "$jar" -b "$jar" http://127.0.0.1:8080/register \
            | sed -n 's/.*name="csrf" value="\([^"]*\)".*/\1/p' | head -n 1)
          test -n "$token" || { echo "no CSRF token on /register"; exit 1; }

          status=$(curl -s -o /dev/null -w '%{http_code}' -c "$jar" -b "$jar" \
            --data-urlencode "csrf=$token" \
            --data-urlencode 'email=ci@example.com' \
            --data-urlencode 'display_name=CI' \
            --data-urlencode 'password=a-long-enough-password' \
            --data-urlencode 'password_confirm=a-long-enough-password' \
            http://127.0.0.1:8080/register)
          test "$status" = 303 || { echo "register answered $status"; exit 1; }

          curl -sf -c "$jar" -b "$jar" http://127.0.0.1:8080/ | grep -q 'Sign out' \
            || { echo "the visitor was not signed in after registering"; exit 1; }

          curl -s -H 'Accept: text/html' http://127.0.0.1:8080/no/such/page | grep -q 'Lava Blog' \
            || { echo "an unrouted 404 was not the blog's own page"; exit 1; }
      - name: Verify the app the way its README says to
        working-directory: /tmp/blog/apps/blog
        run: |
          ./vendor/bin/lava map --check
          ./vendor/bin/lava check --strict
