name: split

# Publishes each package under packages/ to a read-only repository of its own —
# the only shape Packagist can read, because it takes composer.json from the root
# of a repository (DECISIONS.md 229). Every manifest under packages/ is kept
# publishable exactly as it sits in this repository, so this is a pure prefix
# split: nothing is rewritten on the way out, and what CI tested is what ships.
#
# Each mirror is pushed with its own deploy key (DECISIONS.md 251). A mirror whose
# key secret does not exist is skipped with a notice. The one-time setup is in
# docs/releasing.md, "Publishing".

on:
  push:
    branches: [main]
    tags: ['*.*.*']

permissions:
  contents: read

concurrency:
  # One split per ref at a time: two pushes racing to one mirror would make the
  # second a non-fast-forward.
  group: split-${{ github.ref }}
  cancel-in-progress: false

env:
  SPLIT_OWNER: BusyBeaverSoftware
  SPLIT_PREFIX: lava-

jobs:
  split:
    name: packages/${{ matrix.package }}
    runs-on: ubuntu-latest
    # A fork has neither the secrets nor the mirrors; it should not try.
    if: github.repository == 'BusyBeaverSoftware/LavaPHP'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: core, secret: SPLIT_KEY_CORE }
          - { package: db, secret: SPLIT_KEY_DB }
          - { package: validate, secret: SPLIT_KEY_VALIDATE }
          - { package: view, secret: SPLIT_KEY_VIEW }
          - { package: http-client, secret: SPLIT_KEY_HTTP_CLIENT }
          - { package: app, secret: SPLIT_KEY_APP }
    steps:
      - uses: actions/checkout@v4
        with:
          # `git subtree split` walks the prefix's whole history; a shallow clone
          # would publish a history that begins at this commit.
          fetch-depth: 0
          # The push below authenticates with the mirror's own key. Nothing needs
          # checkout's token left behind in the git config.
          persist-credentials: false

      - name: Split packages/${{ matrix.package }}
        id: split
        run: |
          sha=$(git subtree split --prefix="packages/${{ matrix.package }}")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "packages/${{ matrix.package }} splits to $sha"

      - name: Refuse a manifest that only works inside this repository
        # A `repositories` block in a published package is ignored when the
        # package is a dependency and fatal when it is the root — and
        # `composer create-project lavaphp/app` makes the skeleton the root
        # (DECISIONS.md 229). A split that carries one is not published.
        run: |
          git show "${{ steps.split.outputs.sha }}:composer.json" > "$RUNNER_TEMP/split-composer.json"
          if jq -e 'has("repositories")' "$RUNNER_TEMP/split-composer.json" > /dev/null; then
            echo "::error::packages/${{ matrix.package }}/composer.json declares repositories; a published package cannot."
            exit 1
          fi

      - name: Push to the mirror
        env:
          # One deploy key per mirror, able to write to that repository and no
          # other: a leaked key publishes one package rather than six, and no
          # person's credential is involved.
          SPLIT_KEY: ${{ secrets[matrix.secret] }}
          SECRET_NAME: ${{ matrix.secret }}
          PACKAGE: ${{ matrix.package }}
          SHA: ${{ steps.split.outputs.sha }}
        run: |
          if [ -z "$SPLIT_KEY" ]; then
            echo "::notice::$SECRET_NAME is not set, so packages/$PACKAGE was not published. See docs/releasing.md, \"Publishing\"."
            exit 0
          fi

          ssh_dir="$RUNNER_TEMP/split-ssh"
          mkdir -p "$ssh_dir" && chmod 700 "$ssh_dir"
          printf '%s\n' "$SPLIT_KEY" > "$ssh_dir/key" && chmod 600 "$ssh_dir/key"
          # GitHub's host keys, from its API over TLS rather than ssh-keyscan: a
          # key scanned at push time trusts whoever answered the scan.
          curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > "$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$ssh_dir/known_hosts"

          remote="git@github.com:${SPLIT_OWNER}/${SPLIT_PREFIX}${PACKAGE}.git"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # Never forced. A mirror that already has this tag refuses the push,
            # which is "a pushed tag is immutable" enforced where Packagist reads.
            git push "$remote" "$SHA:refs/tags/$GITHUB_REF_NAME"
          else
            git push "$remote" "$SHA:refs/heads/main"
          fi
